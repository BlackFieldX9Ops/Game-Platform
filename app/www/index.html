<style>
/* Layout: app de uma tela, cabeçalho fixo, conteúdo rolável, barra de navegação inferior. Tema escuro único, como nos protótipos. */
:root{

*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--fg);font-family:var(--font);font-size:14px;line-height:1.45;overflow:hidden}
button,input,textarea,select{font:inherit;color:inherit}
button{cursor:pointer;border:0;background:none}

.chips{display:flex;gap:8px;overflow-x:auto;padding-bottom:4px;scrollbar-width:none}

.drop{display:flex;flex-direction:column;align-items:center;gap:6px;border:1.5px dashed var(--line);border-radius:14px;padding:22px;color:var(--muted);text-align:center}
.drop svg{width:28px;height:28px;color:var(--accent)}
.note{color:var(--muted);font-size:12px;margin:8px 0 0}
.empty{border:1.5px dashed var(--line);border-radius:14px;padding:22px;text-align:center;color:var(--muted)}
#player{position:fixed;inset:0;z-index:50;background:#000;display:flex;flex-direction:column;max-width:560px;margin:0 auto}
#player .pb{display:flex;align-items:center;gap:8px;padding:calc(8px + env(safe-area-inset-top,0px)) max(12px,env(safe-area-inset-left,0px)) 8px max(12px,env(safe-area-inset-right,0px));background:var(--surface);border-bottom:1px solid var(--line)}

.mrow{display:flex;align-items:center;gap:12px;width:100%;background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:13px 12px;text-align:left;font-weight:600}

.bub.me{align-self:flex-end;background:var(--accent2)}

var ws=null,wsTimer=null,wsTry=0;
function closeWs(){clearTimeout(wsTimer);if(ws){ws.onclose=null;try{ws.close()}catch(e){}ws=null}}
function connectWs(){
 if(!on())return;closeWs();
 var u=base()?base().replace(/^http/,'ws'):((location.protocol==='https:'?'wss://':'ws://')+location.host);
 try{ws=new WebSocket(u+'/ws?token='+encodeURIComponent(S.token))}catch(e){return}
 ws.onopen=function(){wsTry=0};
 ws.onmessage=function(ev){var m;try{m=JSON.parse(ev.data)}catch(e){return}if(m.type==='message')onIncoming(m.message)};
 ws.onclose=function(e){if(e.code===4401||!on())return;clearTimeout(wsTimer);wsTimer=setTimeout(connectWs,Math.min(30000,1000*Math.pow(2,wsTry++)))};
}

  try{var r=await api('POST','/messages',{to:S.chatId,text:t});(S.rmsgs[S.chatId]=S.rmsgs[S.chatId]||[]).push(r.message)}catch(e){toast(e.message);return}
 }else{(S.chats[S.chat]=S.chats[S.chat]||[]).push({me:1,t:t});save('chats')}
 render(true);var n=document.getElementById('chatIn');if(n)n.focus();view.scrollTop=view.scrollHeight;
}
async function publish(){
 keepForms();var s=S.studio;
 if(!s.title.trim()){toast('Dê um nome ao jogo');return}
 if(!s.code.trim()){toast('Cole ou envie o código do jogo');return}
 var libs=JSON.parse(JSON.stringify(s.libs));
 if(on()){
  var body={title:s.title.trim(),description:s.desc,category:s.cat,age:s.age,dim:s.dim,libs:Object.keys(libs).filter(function(k){return libs[k]}),code:s.code};
  try{
   if(s.editId){var g1=find(s.editId);await api('PUT','/games/'+g1.rid,body);toast('Jogo atualizado')}
   else{await api('POST','/games',body);toast('Publicado na Loja')}
  }catch(e){toast(e.message);return}
  S.studio={title:'',dim:'2D',mode:'code',code:'',libs:{},desc:'',cat:'Ação',age:'Livre',editId:null};
  await refreshAll();return;
 }
 if(s.editId){
  var g0=S.mine.filter(function(g){return g.id===s.editId})[0];
  if(g0){g0.title=s.title.trim();g0.dim=s.dim;g0.cat=s.cat;g0.genre=s.cat;g0.age=s.age;g0.desc=s.desc||g0.desc;g0.code=s.code;g0.libs=libs;g0.icon=s.dim==='3D'?'cube':'pad'}
  save('mine');toast('Jogo atualizado');
 }else{
  var g={id:'u'+Date.now(),title:s.title.trim(),genre:s.cat,cat:s.cat,dim:s.dim,age:s.age,dl:'0',color:PAL[S.mine.length%4],icon:s.dim==='3D'?'cube':'pad',dev:S.name,desc:s.desc||'Jogo publicado no Game Studio.',code:s.code,libs:libs};
  S.mine.unshift(g);S.lib[g.id]=1;save('mine');save('lib');
  pushUpd('Jogo publicado',g.title+' já está na Loja.');toast('Publicado e adicionado à sua biblioteca');
 }
 S.studio={title:'',dim:'2D',mode:'code',code:'',libs:{},desc:'',cat:'Ação',age:'Livre',editId:null};render();
}
async function authGo(){
 var g=function(i){var e=document.getElementById(i);return e?e.value.trim():''},reg=S.authTab==='reg';
 var body={email:g('aMail'),password:(document.getElementById('aPass')||{}).value||''};
 if(reg)body.name=g('aName');
 if(!body.email||!body.password||(reg&&!body.name)){toast('Preencha todos os campos');return}
 try{await probe();var r=await api('POST',reg?'/auth/register':'/auth/login',body);await enter(r);toast(reg?'Conta criada. Bem-vindo!':'Você entrou')}
 catch(e){toast(e.message)}
}
async function act(a,v,t){
 var g;
 switch(a){
  case 'go':S.tab=v;S.sub=null;S.detail=null;render();break;
  case 'sub':S.sub=v;S.tab=SUBTAB[v]||S.tab;S.detail=null;if(v==='settings')S.confirmReset=false;render();
   if(v==='admin'&&on()&&S.user.role==='admin')loadAdmin();
   if(v==='friends'&&on())refreshFriends();
   if(v==='community'&&on())api('GET','/posts').then(function(r){S.rposts=r.posts;if(S.sub==='community')render(true)}).catch(function(){});
   if(v==='upd'&&on())api('GET','/notifications').then(function(r){S.rupd=r.notifications.map(mapNotif);if(S.sub==='upd')render(true)}).catch(function(){});
   if(v==='auth')probe().then(function(){if(S.sub==='auth')render(true)});
   break;
  case 'open':S.detail=v;S.dtab='rev';S.draft.rev='';render();loadReviews(v);break;
  case 'back':if(S.detail)S.detail=null;else if(S.sub==='chat')S.sub='friends';else S.sub=null;render(true);break;
  case 'play':
   g=find(v);if(!g)break;
   if(g.remote){try{var r=await api('POST','/games/'+g.rid+'/play');S.user.xp=r.xp;sv('gp_user',S.user);openGame({title:r.title,code:r.code,libs:libsMap(r.libs)})}catch(e){toast(e.message)}}
   else openGame(g);
   break;
  case 'add':case 'wish':
   var map=a==='add'?S.lib:S.wish,key=a==='add'?'lib':'wish',gm=find(v),had=!!map[v];
   if(gm&&gm.remote){try{await api(had?'DELETE':'PUT','/'+(a==='add'?'library':'wishlist')+'/'+gm.rid)}catch(e){toast(e.message);return}}
   map[v]=had?0:1;save(key);
   toast(a==='add'?(map[v]?'Adicionado à biblioteca':'Removido da biblioteca'):(map[v]?'Guardado na lista de desejos':'Removido da lista de desejos'));render(true);break;
  case 'cat':S.cat=v;S.tab='store';S.sub=null;S.detail=null;render();break;
  case 'dim':S.dim=v;render(true);break;
  case 'dtab':S.dtab=v;render(true);break;
  case 'star':S.stars=+v;render(true);break;
  case 'revpub':
   if(!S.draft.rev.trim()){toast('Escreva um comentário');return}
   g=find(v);
   if(g&&g.remote){
    try{await api('POST','/games/'+g.rid+'/reviews',{stars:S.stars,text:S.draft.rev.trim()});(S.rev._r=S.rev._r||[]).push({});save('rev');S.draft.rev='';toast('Avaliação publicada');await loadReviews(v);var gs=await api('GET','/games/'+g.rid);g.rating=gs.game.rating;render(true)}catch(e){toast(e.message)}
   }else{(S.rev[v]=S.rev[v]||[]).push({n:myName(),s:S.stars,t:S.draft.rev.trim(),d:today()});save('rev');S.draft.rev='';toast('Avaliação publicada');render(true)}
   break;
  case 'report':
   var p=v.split(':');
   try{await api('POST','/reports',{targetType:p[0],targetId:+p[1],reason:'Conteúdo impróprio'});toast('Denúncia enviada. Obrigado.')}catch(e){toast(e.message)}
   break;
  case 'stab':S.stab=v;render();if(v==='painel'&&on())loadStats();break;
  case 'sdim':S.studio.dim=v;render(true);break;
  case 'smode':S.studio.mode=v;render(true);break;
  case 'tpl':S.studio.code=TEMPLATE;render(true);break;
  case 'stest':if(!S.studio.code.trim()){toast('Cole ou envie o código primeiro');return}openGame({title:S.studio.title||'Teste',code:S.studio.code,libs:S.studio.libs});break;
  case 'spub':await publish();break;
  case 'edit':
   g=myGames().filter(function(x){return x.id===v})[0];if(!g)break;
   var code=g.code,libs=g.libs||{};
   if(g.remote){try{var src=await api('GET','/games/'+g.rid+'/source');code=src.code;libs=libsMap(src.libs)}catch(e){toast(e.message);return}}
   S.studio={title:g.title,dim:g.dim,mode:'code',code:code,libs:JSON.parse(JSON.stringify(libs)),desc:g.desc||'',cat:g.cat||'Ação',age:g.age||'Livre',editId:g.id};S.stab='pub';render();toast('Editando '+g.title);break;
  case 'del':
   g=find(v);
   if(g&&g.remote){try{await api('DELETE','/games/'+g.rid)}catch(e){toast(e.message);return}toast('Jogo removido');await refreshAll();break}
   S.mine=S.mine.filter(function(x){return x.id!==v});delete S.lib[v];save('mine');save('lib');toast('Jogo removido');render(true);break;
  case 'post':
   if(!S.draft.post.trim()){toast('Escreva algo para publicar');return}
   if(on()){try{await api('POST','/posts',{text:S.draft.post.trim(),gameId:S.draft.pg&&S.draft.pg[0]==='r'?+S.draft.pg.slice(1):undefined});S.rposts=(await api('GET','/posts')).posts}catch(e){toast(e.message);return}}
   else{S.posts.unshift({id:'p'+Date.now(),t:S.draft.post.trim(),g:S.draft.pg||''});save('posts')}
   S.draft.post='';toast('Publicado na comunidade');render(true);break;
  case 'like':
   if(on()&&v[0]==='r'){var pp=S.rposts.filter(function(x){return 'r'+x.id===v})[0];try{var lr=await api('POST','/posts/'+v.slice(1)+'/like');if(pp){pp.liked=lr.liked;pp.likes+=lr.liked?1:-1}}catch(e){toast(e.message);return}}
   else{S.likes[v]=S.likes[v]?0:1;save('likes')}
   render(true);break;
  case 'delpost':
   if(on()&&v[0]==='r'){try{await api('DELETE','/posts/'+v.slice(1));S.rposts=S.rposts.filter(function(x){return 'r'+x.id!==v})}catch(e){toast(e.message);return}}
   else{S.posts=S.posts.filter(function(x){return x.id!==v});save('posts')}
   render(true);break;
  case 'addfriend':
   var fi=document.getElementById('fName'),n=fi&&fi.value.trim();
   if(!n){toast('Digite o nome do jogador');return}
   if(on()){try{await api('POST','/friends/request',{name:n});S.rfriends=(await api('GET','/friends')).friends;toast('Pedido enviado')}catch(e){toast(e.message);return}}
   else{
    if(S.friends.some(function(f){return f.n.toLowerCase()===n.toLowerCase()})){toast('Esse amigo já está na lista');return}
    S.friends.push({n:n,st:'offline',g:'Adicionado agora'});save('friends');toast('Amigo adicionado');
   }
   render(true);break;
  case 'accept':try{await api('POST','/friends/'+v+'/accept');S.rfriends=(await api('GET','/friends')).friends;toast('Amizade aceita');render(true)}catch(e){toast(e.message)}break;
  case 'rmfriendr':try{await api('DELETE','/friends/'+v);S.rfriends=(await api('GET','/friends')).friends;render(true)}catch(e){toast(e.message)}break;
  case 'rmfriend':S.friends=S.friends.filter(function(f){return f.n!==v});save('friends');render(true);break;
  case 'chatopen':
   S.chat=v;S.chatId=t.dataset.id?+t.dataset.id:null;S.sub='chat';S.tab='profile';S.detail=null;render();
   if(on()&&S.chatId)loadMsgs(S.chatId);break;
  case 'send':await sendMsg();break;
  case 'modok':case 'modrm':S.mod=S.mod.filter(function(m){return String(m.id)!==v});save('mod');toast(a==='modok'?'Denúncia arquivada':'Conteúdo removido');render(true);break;
  case 'usertg':var u=S.users[+v];u.st=u.st==='Suspenso'?'Ativo':'Suspenso';save('users');render(true);break;
  case 'repres':var q=v.split(':');try{await api('POST','/admin/reports/'+q[0]+'/resolve',{action:q[1]});toast(q[1]==='remove'?'Conteúdo removido':'Denúncia arquivada');await loadAdmin();refreshAll()}catch(e){toast(e.message)}break;
  case 'usertgr':var w=v.split(':');try{await api('POST','/admin/users/'+w[0]+'/status',{status:w[1]});toast(w[1]==='active'?'Usuário reativado':'Usuário suspenso');await loadAdmin()}catch(e){toast(e.message)}break;
  case 'gnotif':
   var gm2=document.getElementById('gMsg'),m=gm2&&gm2.value.trim();
   if(!m){toast('Escreva a mensagem');return}
   if(on()){try{await api('POST','/admin/notify',{title:'Aviso da plataforma',body:m})}catch(e){toast(e.message);return}}
   else pushUpd('Aviso da plataforma',m);
   toast('Notificação enviada');render(true);break;
  case 'authtab':S.authTab=v;render(true);break;
  case 'authgo':await authGo();break;
  case 'logout':logout();break;
  case 'srvsave':
   var su=document.getElementById('srvUrl');S.server=su?su.value.trim():S.server;
   if(S.server&&!/^https?:\/\//i.test(S.server))S.server='https://'+S.server;
   sv('gp_server',S.server);toast('Testando conexão…');
   var okc=await probe();toast(okc?'Servidor conectado':'Não foi possível conectar. Confira o endereço.');render(true);
   if(okc&&on()){connectWs();refreshAll()}
   break;
  case 'ori':S.cfg.ori=v;save('cfg');applyNative();render(true);break;
  case 'reset':S.confirmReset=true;render(true);break;
  case 'resetno':S.confirmReset=false;render(true);break;
  case 'resetyes':
   closeWs();
   try{Object.keys(localStorage).forEach(function(k){if(k.indexOf('gp_')===0)localStorage.removeItem(k)})}catch(er){}
   S=init();toast('Dados apagados');render();applyNative();probe();break;
 }
}
document.addEventListener('click',function(e){
 var t=e.target.closest('[data-a]');if(!t)return;keepForms();
 act(t.dataset.a,t.dataset.v,t).catch(function(er){toast(er&&er.message?er.message:'Algo deu errado')});
});
document.addEventListener('change',function(e){
 var t=e.target;
 if(t.id==='sFile'&&t.files[0]){var f=t.files[0];if(f.size>4e6){toast('Arquivo maior que 4 MB');return}var r=new FileReader();r.onload=function(){keepForms();S.studio.code=String(r.result);if(!S.studio.title)S.studio.title=f.name.replace(/\.[^.]+$/,'');render(true);toast('Arquivo carregado')};r.readAsText(f)}
 if(t.dataset.lib){S.studio.libs[t.dataset.lib]=t.checked}
 if(t.dataset.mon){S.mon[t.dataset.mon]=t.checked?1:0;save('mon');render(true)}
 if(t.dataset.cfg){S.cfg[t.dataset.cfg]=t.checked?1:0;save('cfg');if(t.dataset.cfg==='admin')render(true);if(t.dataset.cfg==='fs')applyNative()}
 if(t.id==='sName'){S.name=t.value.trim()||'Jogador';save('name')}
});
document.addEventListener('keydown',function(e){
 if(e.key!=='Enter')return;
 if(e.target.id==='chatIn'){e.preventDefault();sendMsg()}
 if(e.target.id==='aPass'){e.preventDefault();authGo()}
});
$('#q').addEventListener('input',function(e){S.q=e.target.value;S.tab='store';S.sub=null;S.detail=null;render(true)});
render();
applyNative();
var fsTry=0;
document.addEventListener('pointerdown',function(){
 if(native()||!S.cfg.fs||fsTry>2||document.fullscreenElement||!document.documentElement.requestFullscreen||!matchMedia('(pointer:coarse)').matches)return;
 fsTry++;
 document.documentElement.requestFullscreen({navigationUI:'hide'}).then(function(){applyNative()}).catch(function(){});
},{passive:true});
setInterval(function(){if(on()&&!document.hidden)refreshFriends()},20000);
(async function start(){
 await probe();
 if(S.token&&S.user){
  if(S.srvOk){connectWs();await refreshAll()}
  else toast('Sem conexão com o servidor. Você está vendo os dados locais.');
 }
})();
})();
</script>
