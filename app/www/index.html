async function loadSpace(id,keep){
 try{
  var r=await api('GET','/spaces/'+id),d={space:r.space,members:r.members,events:r.events,posts:[],msgs:null};
  if(r.space.my_status==='active'||r.space.access!=='private'){try{d.posts=(await api('GET','/posts?space='+id)).posts}catch(e){}}
  if(r.space.my_status==='active'){try{d.msgs=(await api('GET','/spaces/'+id+'/messages')).messages.map(function(x){return x})}catch(e){}}
  S.spc=d;if(S.sub==='space')render(true);
  if(d.msgs)loadConvs();
 }catch(e){toast(e.message);if(S.sub==='space'){S.sub='community';render()}}
}
async function loadComments(pid){try{S.rcm[pid]=(await api('GET','/posts/'+pid+'/comments')).comments;render(true)}catch(e){toast(e.message)}}
function openRoom(type,id,name){
 S.room={type:type,id:id,name:name};S.sub='chat';S.tab='chat';S.detail=null;S.pimg='';S.pgame='';S.gpick=false;render();
 var k=type+':'+id;
 if(!on())return;
 (type==='direct'?api('GET','/messages/'+id):api('GET','/spaces/'+id+'/messages')).then(function(r){S.rooms[k]=r.messages;if(S.sub==='chat'&&S.room&&S.room.type+':'+S.room.id===k){render(true);view.scrollTop=view.scrollHeight}loadConvs()}).catch(function(e){toast(e.message)});

function shrinkImg(f,W,H,steps,limit,cb){
 if(!/^image\//.test(f.type)){toast('Escolha uma imagem (JPG, PNG ou WebP)');return}
 var u=URL.createObjectURL(f),im=new Image();
 im.onload=function(){
  try{

function wsAct(a,v,t){
 if(a.slice(0,2)!=='w_')return false;
 var U=WS.users,C=WS.ct;
 switch(a){
  case 'w_sec':wsMsgKeep();WS.sec=v;if(v==='studio'&&studioOn()){S.tab='studio';S.sub=null;S.detail=null;if(!S.stab||S.stab==='painel')S.stab='pub'}if(v==='users'||v==='mod'||v==='rep'||v==='audit'||v==='over'||v==='games'||v==='msg'||(v==='buy'&&wsCan('finance'))||v==='sec'||v==='ver'||v==='ntf'){wsRender();wsLoad(v)}else if(v==='cfg'){wsRender();wsLoadCfg()}else wsRender();break;
  case 'w_exit':try{if(wsBig())localStorage.setItem('gp_ws_off','1');else localStorage.removeItem('gp_ws_m')}catch(e){}wsOff();render();toast('Modo app ativado. Para voltar ao painel: Configurações → Painel de gestão');break;
  case 'w_enter':wsEnter();toast('Painel de gestão ativado');break;
  case 'w_refresh':wsLoad(WS.sec);break;
  case 'w_uload':wsLoad('users');break;
  case 'w_uopen':case 'w_uopen2':if(a==='w_uopen2'){WS.sec='users'}wsOpenUser(Number(v));if(a==='w_uopen2'&&!U.list.length)wsLoad('users');break;
  case 'w_uclose':U.sel=null;U.det=null;wsRender();break;
  case 'w_uconteudo':C.user=Number(v);C.q='';C.kind='comment';WS.sec='mod';wsLoad('mod');break;
  case 'w_ustatus':{
   var p=v.split(':'),id=Number(p[0]),st=p[1],d=U.det,nm=d?d.name:'este usuário',adm=wsIsAdmin();
   if(st==='suspended')wsAsk({title:'Suspender '+nm,body:'A pessoa não consegue entrar até o prazo acabar. O motivo fica na auditoria.',days:adm?[1,3,7,14,30,90,365]:[1,3,7,14,30],dflt:7,need:1,ok:'Suspender',danger:1,run:function(r,dd){return wsDo('/admin/users/'+id+'/status',{status:'suspended',days:dd,reason:r},'Conta suspensa')}});
   else if(st==='banned')wsAsk({title:'Banir '+nm,body:'O banimento não tem prazo. Só um administrador pode desfazer.',need:1,ok:'Banir',danger:1,run:function(r){return wsDo('/admin/users/'+id+'/status',{status:'banned',reason:r},'Conta banida')}});
   else wsAsk({title:(d&&d.status==='banned'?'Desbanir ':'Reativar ')+nm,body:'A conta volta a funcionar na hora.',need:0,ok:'Confirmar',run:function(r){return wsDo('/admin/users/'+id+'/status',{status:'active',reason:r},'Conta ativa')}});
   break}
  case 'w_urole':{
   var q=v.split(':'),rid=Number(q[0]),rl=q[1],dn=U.det?U.det.name:'este usuário';
   wsAsk({title:rl==='mod'?'Tornar '+dn+' moderador':'Remover moderação de '+dn,body:rl==='mod'?'Moderadores veem usuários, denúncias e conteúdo; suspendem de 1 a 30 dias. Não veem dinheiro nem banem.':'A pessoa volta a ser jogador comum.',need:0,ok:'Confirmar',run:function(){return wsDo('/admin/users/'+rid+'/role',{role:rl},rl==='mod'?'Agora é moderador':'Moderação removida')}});break}
  case 'w_mcancel':WS.modal=null;wsRender();break;
  case 'w_mok':{
   var m=WS.modal;if(!m)break;
   var rn=document.getElementById('wsMReason'),dd=document.getElementById('wsMDays'),r=rn?rn.value.trim():'';
   if(m.need&&r.length<5&&m.need>0){toast('Escreva o motivo (mínimo 5 letras)');break}
   var fv={};(m.fields||[]).forEach(function(f){var e=document.getElementById('wsMF_'+f.k);fv[f.k]=e?e.value:''});
   if(m.check){var er=m.check(fv);if(er){toast(er);break}}
   m.text=r;m.run(r,dd?Number(dd.value):undefined,fv);break}
  case 'w_ctab':C.kind=v;C.pick={};wsLoad('mod');break;
  case 'w_cload':C.user=null;wsLoad('mod');break;
  case 'w_cmore':wsContent(false).then(wsRender).catch(function(e){toast(e.message);wsRender()});break;
  case 'w_cpick':if(C.pick[v])delete C.pick[v];else C.pick[v]=1;wsRender();break;
  case 'w_call':{var all=C.items.length&&Object.keys(C.pick).length===C.items.length;C.pick={};if(!all)C.items.forEach(function(i){C.pick[i.kind+':'+i.id]=1});wsRender();break}
  case 'w_cone':C.pick={};C.pick[v]=1;wsRemoveAsk();break;
  case 'w_cbulk':wsRemoveAsk();break;
  case 'w_rres':{
   var z=v.split(':'),rid2=Number(z[0]),act=z[1];
   if(act==='dismiss'){api('POST','/admin/reports/'+rid2+'/resolve',{action:'dismiss'}).then(function(){toast('Denúncia dispensada');wsLoad('rep')}).catch(function(e){toast(e.message)})}
   else wsAsk({title:'Aplicar a denúncia',body:'O conteúdo é removido (ou o jogador é suspenso). Isso não pode ser desfeito.',need:0,ok:'Confirmar',danger:1,run:function(){WS.modal=null;return api('POST','/admin/reports/'+rid2+'/resolve',{action:'remove'}).then(function(){toast('Denúncia resolvida');wsLoad('rep')}).catch(function(e){toast(e.message);wsRender()})}});
   break}
  case 'w_aload':wsLoad('audit');break;
  case 'w_amore':wsAuditLoad(false).then(wsRender).catch(function(e){toast(e.message);wsRender()});break;
  default:return wsAct2(a,v,t)||wsAct3(a,v,t);
 }
 return true;

async function wsKSearch(){
 var K=WS.k,q=K.q.trim();K.found=[];
 if(q.length>=2){
  var jobs=[];
  if(wsCan('users'))jobs.push(api('GET','/admin/users?limit=5&q='+encodeURIComponent(q)).then(function(r){return r.users.map(function(u){return{t:'user',label:u.name,sub:'#'+(u.uidFmt||u.uid)+' · '+WS_ROLE[u.role],v:u.id}})}).catch(function(){return[]}));
  if(wsCan('games'))jobs.push(api('GET','/admin/games/stats?sort=plays&q='+encodeURIComponent(q)).then(function(r){return r.games.slice(0,5).map(function(g){return{t:'game',label:g.title,sub:'Jogo de '+g.developer,v:g.id}})}).catch(function(){return[]}));
  var r=await Promise.all(jobs);if(WS.k!==K||K.q.trim()!==q)return;
  r.forEach(function(x){K.found=K.found.concat(x)});
 }

function wsKGo(i){

 else if(it.t==='user'){wsAct('w_uopen2',String(it.v))}
 else{WS.sec='games';wsOpenGame(it.v);if(!WS.gm.list.length)wsLoad('games')}

function wsAct4(a,v,t){
 var X=WS.x;
 switch(a){
  case 'w_cfno':{var c=WS.cf;WS.cf=null;if(c)c.res(false);wsxRender();break}
  case 'w_cfre':{var c1=WS.cf;if(!c1)break;c1.err='';api('POST','/admin/confirm/request',{}).then(function(q){c1.to=q.to||c1.to;c1.err='';toast('Código reenviado');wsxRender()}).catch(function(e){c1.err=e.message;wsxRender()});break}
  case 'w_cfok':{var c2=WS.cf,inp=document.getElementById('wsCfIn');if(!c2||!inp)break;var val=inp.value.trim();if(!val){toast(c2.step==='code'?'Digite o código':'Digite a senha');break}
   api('POST','/admin/confirm/verify',c2.step==='code'?{code:val}:{password:val}).then(function(r){S.cTok=r.token;S.cExp=r.expires;WS.cf=null;c2.res(true);wsxRender()}).catch(function(e){c2.err=e.message;wsxRender()});break}
  case 'w_chd':X.chd=Number(v);api('GET','/admin/charts?days='+X.chd).then(function(r){X.charts=r;wsRender()}).catch(function(e){toast(e.message)});break;
  case 'w_trrest':api('POST','/admin/trash/'+v+'/restore',{}).then(function(){toast('Restaurado');return wsContent(true)}).then(wsRender).catch(function(e){toast(e.message);wsRender()});break;
  case 'w_perm':{var p=v.split(':'),id=Number(p[0]),cur=(X.pd[id]||(WS.users.det&&WS.users.det.id===id?WS.users.det.perms:[])||[]).slice(),ix=cur.indexOf(p[1]);if(ix>=0)cur.splice(ix,1);else cur.push(p[1]);X.pd[id]=cur;wsRender();break}
  case 'w_permsave':{var uid=Number(v),list=X.pd[uid]||(WS.users.det?WS.users.det.perms:[])||[];
   api('POST','/admin/users/'+uid+'/perms',{perms:list}).then(function(){toast('Permissões salvas');delete X.pd[uid];return wsOpenUser(uid)}).catch(function(e){toast(e.message)});break}
  case 'w_klogout':{var kid=Number(v),who=X.sessions.filter(function(s){return s.id===kid})[0];
   wsAsk({title:'Encerrar sessões de '+(who?who.name:'esta pessoa'),body:'Ela é deslogada de todos os aparelhos agora e precisa entrar de novo com a senha.'+(kid===S.user.id?' Isso inclui você.':''),need:0,ok:'Encerrar',danger:1,run:function(){return api('POST','/admin/users/'+kid+'/logout',{}).then(function(r){WS.modal=null;toast('Sessões encerradas');if(r.self){logout(true);return}return wsLoadSec().then(wsRender)}).catch(function(e){toast(e.message);wsRender()})}});break}
  case 'w_bkrun':api('POST','/admin/backups/run',{}).then(function(r){toast('Backup criado');X.backups=Object.assign({},X.backups,{backups:r.backups});wsRender()}).catch(function(e){toast(e.message)});break;
  case 'w_bkdl':wsDownload('/admin/backups/'+encodeURIComponent(v),v);break;
  case 'w_acsv':wsDownload('/admin/audit.csv','auditoria.csv');break;
  case 'w_scsv':wsDownload('/admin/sales.csv','vendas.csv');break;
  case 'w_cpnew':{var cp=X.cp,body={code:cp.code.trim().toUpperCase(),kind:cp.kind,value:Number(cp.value),scope:cp.scope,max_uses:Number(cp.max)||0,ends_at:cp.end||''};
   if(body.code.length<3){toast('Escreva o código do cupom');break}
   api('POST','/admin/coupons',body).then(function(){toast('Cupom criado');X.cp.code='';return wsLoadBuyX('coupons')}).catch(function(e){toast(e.message)});break}
  case 'w_cptog':api('POST','/admin/coupons/'+encodeURIComponent(v)+'/toggle',{}).then(function(){return wsLoadBuyX('coupons')}).catch(function(e){toast(e.message)});break;
  case 'w_notif':try{Notification.requestPermission().then(function(p){toast(p==='granted'?'Avisos do navegador ativados':'Avisos não permitidos');wsRender()})}catch(e){toast('Este navegador não suporta avisos')}break;
  case 'w_k':wsKOpen();break;
  case 'w_kgo':wsKGo(Number(v));break;
  default:return false;
 }
 return true;
}

 var t=e.target;

 if(!wsOn())return;
 if((e.ctrlKey||e.metaKey)&&String(e.key).toLowerCase()==='k'){e.preventDefault();if(WS.k.open)wsKClose();else wsKOpen();return}
 if(WS.k.open&&t&&t.id==='wsKq'){
  if(e.key==='ArrowDown'){e.preventDefault();WS.k.idx=Math.min(WS.k.items.length-1,WS.k.idx+1);var l=document.getElementById('wsKl');if(l){l.innerHTML=wsKList();var on_=l.querySelector('.on');if(on_&&on_.scrollIntoView)on_.scrollIntoView({block:'nearest'})}return}
  if(e.key==='ArrowUp'){e.preventDefault();WS.k.idx=Math.max(0,WS.k.idx-1);var l2=document.getElementById('wsKl');if(l2){l2.innerHTML=wsKList();var o2=l2.querySelector('.on');if(o2&&o2.scrollIntoView)o2.scrollIntoView({block:'nearest'})}return}
  if(e.key==='Enter'){e.preventDefault();wsKGo(WS.k.idx);return}
 }
 if(e.key==='Escape'){
  if(WS.cf){wsAct4('w_cfno');return}
  if(WS.k.open){wsKClose();return}
  if(WS.modal){WS.modal=null;wsRender();return}
  if(WS.sec==='users'&&WS.users.sel!==null){WS.users.sel=null;WS.users.det=null;wsRender();return}
  if(WS.sec==='games'&&WS.gm.sel!==null){WS.gm.sel=null;WS.gm.det=null;wsRender()}
 }

document.addEventListener('click',function(e){

 if(t.id==='pfCover'&&t.files[0]){setProfCover(t.files[0]);t.value=''}

 if(t.dataset.lib){S.studio.libs[t.dataset.lib]=t.checked}
 if(t.dataset.ss){S.studio[t.dataset.ss]=t.checked?1:0}
 if(t.id==='xFile'&&t.files[0]){var xf=t.files[0];t.value='';if(xf.size>150000){toast('Arquivo grande demais (máximo 150 KB)');return}var xr=new FileReader();xr.onload=function(){S.studio.ext.push({n:xf.name.slice(0,40),c:String(xr.result)});render(true)};xr.readAsText(xf)}
 if(t.dataset.mon){S.mon[t.dataset.mon]=t.checked?1:0;save('mon');render(true)}
 if(t.dataset.cfg==='admin'){
  if(t.checked&&!S.admOk){S.cfg.admin=0;S.admForm=admRec()?'enter':'create'}
  else{S.cfg.admin=t.checked?1:0;if(!t.checked){S.admOk=false;S.admForm=null}}
  save('cfg');render(true);return}
 if(t.dataset.cfg){S.cfg[t.dataset.cfg]=t.checked?1:0;save('cfg');if(t.dataset.cfg==='fs')applyNative()}
 if(t.id==='sName'){S.name=t.value.trim()||'Jogador';save('name')}
});
