name: Testes

on:
  push:
  pull_request:

jobs:
  servidor-e-app:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: server
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Instalar dependências
        run: npm ci

      - name: Testes da API
        run: npm test

      - name: Teste do app com o servidor (dois jogadores)
        run: npm run test:app
