name: Testes

on:
  push:
  pull_request:

jobs:
  servidor-e-app:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: server
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Instalar dependências
        run: npm ci

      - name: Testes da API
        run: npm test

      - name: Teste do app com o servidor (dois jogadores)
        run: |
          npm run test:app
          npm run test:zip

  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Construir a imagem do servidor
        run: docker build -t game-platform .
      - name: Subir e consultar o servidor
        run: |
          docker run -d --name gp -p 3000:3000 -e JWT_SECRET=teste-ci -e ADMIN_EMAIL=ci@exemplo.com game-platform
          for i in $(seq 1 30); do curl -fsS http://localhost:3000/api/health && break; sleep 1; done
          curl -fsS http://localhost:3000/api/health
          curl -fsS http://localhost:3000/index.html | grep -q "Game Platform"
          curl -fsS http://localhost:3000/vendor/fonts/plus-jakarta-sans-latin-400-normal.woff2 -o /dev/null
          docker logs gp | tail -5
      - name: Validar o Caddyfile e o docker-compose do deploy
        run: |
          docker run --rm -e DOMINIO=exemplo.com -v "$PWD/deploy/Caddyfile:/etc/caddy/Caddyfile:ro" caddy:2 caddy validate --config /etc/caddy/Caddyfile
          JWT_SECRET=x ADMIN_EMAIL=a@b.c DOMINIO=exemplo.com docker compose -f deploy/docker-compose.yml config -q
