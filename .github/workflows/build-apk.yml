name: Gerar APK

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'app/**'
      - '.github/workflows/build-apk.yml'

permissions:
  contents: write

jobs:
  apk:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Definir o servidor padrão do app
        env:
          SERVER_URL: ${{ vars.SERVER_URL }}
        run: |
          # Sem a variável, o app oficial já nasce apontando para o servidor central.
          [ -n "$SERVER_URL" ] || SERVER_URL="https://game-platform-dgvz.onrender.com"
          sed -i "s|<meta name=\"gp-server\" content=\"\">|<meta name=\"gp-server\" content=\"$SERVER_URL\">|" www/index.html
          grep -q "name=\"gp-server\" content=\"$SERVER_URL\"" www/index.html || { echo "Servidor padrão não foi gravado no app"; exit 1; }
          echo "Servidor padrão: $SERVER_URL"

      - name: Registrar o número desta versão no app
        env:
          BUILD: ${{ github.run_number }}
        run: sed -i "s|<meta name=\"gp-build\" content=\"\">|<meta name=\"gp-build\" content=\"$BUILD\">|; s|<meta name=\"gp-repo\" content=\"[^\"]*\">|<meta name=\"gp-repo\" content=\"${{ github.repository }}\">|" www/index.html

      - name: Instalar dependências
        run: |
          # O download do binário do sharp (GitHub) às vezes dá 504; tenta de novo antes de desistir.
          for i in 1 2 3 4; do
            npm install && exit 0
            echo "npm install falhou (tentativa $i); aguardando para tentar de novo"
            rm -rf node_modules/sharp
            sleep $((i * 20))
          done
          exit 1

      - name: Notificações externas (Firebase) — opcional
        id: fcm
        env:
          GOOGLE_SERVICES_JSON: ${{ secrets.GOOGLE_SERVICES_JSON }}
        run: |
          # Só liga as notificações do Android quando o segredo GOOGLE_SERVICES_JSON (base64) existe.
          if [ -n "$GOOGLE_SERVICES_JSON" ]; then
            echo "$GOOGLE_SERVICES_JSON" | base64 -d > /tmp/google-services.json
            python3 -c "import json;d=json.load(open('/tmp/google-services.json'));assert d['client'][0]['client_info']['android_client_info']['package_name']=='com.gameplatform.app',d['client'][0]['client_info']['android_client_info']['package_name']" || { echo "google-services.json inválido ou de outro pacote (esperado com.gameplatform.app)"; exit 1; }
            npm install @capacitor/push-notifications
            echo "on=1" >> "$GITHUB_OUTPUT"
            echo "Notificações do Android: ligadas"
          else
            echo "GOOGLE_SERVICES_JSON não definido: o APK sai sem notificações externas (o app continua com a central de avisos interna)."
          fi

      - name: Criar o projeto Android
        run: npx cap add android

      - name: Aplicar o código nativo (tela cheia, rotação e atualização automática)
        run: |
          cp native/MainActivity.java android/app/src/main/java/com/gameplatform/app/MainActivity.java
          M=android/app/src/main/AndroidManifest.xml
          sed -i 's#</manifest>#    <uses-permission android:name="android.permission.REQUEST_INSTALL_PACKAGES" />\n    <uses-permission android:name="android.permission.UPDATE_PACKAGES_WITHOUT_USER_ACTION" />\n</manifest>#' "$M"
          grep -q UPDATE_PACKAGES_WITHOUT_USER_ACTION "$M" || { echo "Permissão de atualização silenciosa não entrou no manifesto"; exit 1; }
          # Volta do login com o Google (gameplatform://auth?code=...)
          python3 - "$M" <<'PY'
          import sys
          p = sys.argv[1]; s = open(p).read()
          flt = '''<intent-filter>
                      <action android:name="android.intent.action.VIEW" />
                      <category android:name="android.intent.category.DEFAULT" />
                      <category android:name="android.intent.category.BROWSABLE" />
                      <data android:scheme="gameplatform" android:host="auth" />
                  </intent-filter>'''
          i = s.index('</intent-filter>') + len('</intent-filter>')
          open(p, 'w').write(s[:i] + '\n                ' + flt + s[i:])
          PY
          grep -q 'android:scheme="gameplatform"' "$M" || { echo "Link de retorno do login não entrou no manifesto"; exit 1; }
          # Endurecimento: sem backup do Android (ninguém copia os dados do app), sem tráfego sem HTTPS
          sed -i 's#android:allowBackup="true"#android:allowBackup="false"#' "$M"
          grep -q 'android:allowBackup="false"' "$M" || { echo "allowBackup não ficou desligado"; exit 1; }
          sed -i '0,/<application/s#<application#<application android:usesCleartextTraffic="false"#' "$M"
          grep -q 'usesCleartextTraffic="false"' "$M" || { echo "tráfego sem HTTPS não foi bloqueado"; exit 1; }
          grep -q REQUEST_INSTALL_PACKAGES "$M" || { echo "Permissão de instalação não entrou no manifesto"; exit 1; }
          if [ "${{ steps.fcm.outputs.on }}" = "1" ]; then
            cp /tmp/google-services.json android/app/google-services.json
            sed -i 's#</manifest>#    <uses-permission android:name="android.permission.POST_NOTIFICATIONS" />\n</manifest>#' "$M"
            grep -q POST_NOTIFICATIONS "$M" || { echo "Permissão de notificações não entrou no manifesto"; exit 1; }
          fi

      - name: Compilar para o Android 16 (API 36)
        run: |
          V=android/variables.gradle
          sed -i -E 's/(compileSdkVersion|targetSdkVersion) *= *[0-9]+/\1 = 36/' "$V"
          grep -E "compileSdkVersion|targetSdkVersion|minSdkVersion" "$V"
          grep -q "targetSdkVersion = 36" "$V" || { echo "targetSdk 36 não foi aplicado"; exit 1; }

      - name: Usar a chave fixa e numerar a versão (permite atualizar por cima)
        env:
          BUILD: ${{ github.run_number }}
        run: |
          mkdir -p ~/.android
          cp keystore/debug.keystore ~/.android/debug.keystore
          cat >> android/app/build.gradle <<'GRADLE'

          android {
              signingConfigs {
                  debug {
                      storeFile file('../../keystore/debug.keystore')
                      storePassword 'android'
                      keyAlias 'androiddebugkey'
                      keyPassword 'android'
                  }
              }
              buildTypes {
                  debug {
                      debuggable false
                  }
              }
          }
          GRADLE
          sed -i -E "s/versionCode [0-9]+/versionCode $BUILD/; s/versionName \"[^\"]*\"/versionName \"1.2.$BUILD\"/" android/app/build.gradle
          grep -n "versionCode\|versionName" android/app/build.gradle

      - name: Gerar ícones e tela de abertura
        run: npx capacitor-assets generate --android --iconBackgroundColor '#0a1133' --splashBackgroundColor '#0a1133'

      - name: Copiar o app para o Android
        run: npx cap sync android

      - name: Compilar o APK
        working-directory: app/android
        run: |
          chmod +x gradlew
          # O download do Gradle (GitHub/services.gradle.org) às vezes dá 504 ou timeout; tenta de novo.
          for i in 1 2 3 4 5; do
            ./gradlew assembleDebug && exit 0
            echo "gradle falhou (tentativa $i); aguardando para tentar de novo"
            sleep $((i * 30))
          done
          exit 1

      - name: Conferir que a assinatura é a chave fixa
        run: |
          APK=android/app/build/outputs/apk/debug/app-debug.apk
          WANT=$(keytool -list -v -keystore keystore/debug.keystore -storepass android 2>/dev/null | grep -m1 'SHA256:' | sed 's/.*SHA256: *//' | tr -d ':' | tr 'a-f' 'A-F')
          SIGNER=$(ls "${ANDROID_HOME:-$ANDROID_SDK_ROOT}"/build-tools/*/apksigner | sort -V | tail -1)
          GOT=$("$SIGNER" verify --print-certs "$APK" | grep -m1 'SHA-256 digest' | sed 's/.*: *//' | tr -d ':' | tr 'a-f' 'A-F')
          echo "esperada: $WANT"; echo "do APK:   $GOT"
          [ -n "$WANT" ] && [ "$WANT" = "$GOT" ] || { echo "A assinatura do APK não é a da chave fixa"; exit 1; }
          AAPT=$(ls "${ANDROID_HOME:-$ANDROID_SDK_ROOT}"/build-tools/*/aapt2 | sort -V | tail -1)
          if "$AAPT" dump badging "$APK" | grep -q "application-debuggable"; then echo "O APK saiu depurável (qualquer um poderia abrir os dados do app)"; exit 1; fi
          echo "APK não depurável: ok"

      - name: Guardar o APK na execução
        uses: actions/upload-artifact@v4
        with:
          name: game-platform-apk
          path: app/android/app/build/outputs/apk/debug/app-debug.apk

      - name: Publicar o APK no link fixo
        working-directory: .
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          cp app/android/app/build/outputs/apk/debug/app-debug.apk game-platform.apk
          gh release delete apk-latest --yes --cleanup-tag || true
          gh release create apk-latest game-platform.apk \
            --target "${{ github.sha }}" \
            --prerelease \
            --title "APK mais recente" \
            --notes "Build ${{ github.run_number }}. APK de teste do Game Platform. Baixe o arquivo game-platform.apk no celular Android e abra para instalar. O Android pede para permitir a instalação de apps desconhecidos."
