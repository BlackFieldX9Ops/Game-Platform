# Publicação do servidor no Render (Blueprint). Veja o README.md, passo 2.
services:
  - type: web
    name: game-platform
    runtime: docker
    dockerfilePath: ./Dockerfile
    dockerContext: .
    plan: starter
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: JWT_SECRET
        generateValue: true
      - key: ADMIN_EMAIL
        sync: false
    disk:
      name: dados
      mountPath: /app/data
      sizeGB: 1
